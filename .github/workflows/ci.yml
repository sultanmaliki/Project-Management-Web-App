name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=95

  backend-postgres:
    name: Backend on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projectflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PG_URL: postgresql://postgres:postgres@localhost:5432/projectflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Test suite against PostgreSQL
        run: TEST_DATABASE_URL="$PG_URL" pytest
      - name: Migrations apply cleanly and match the models
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-only-secret-key-ci-only-secret-key
          PGPASSWORD: postgres
        run: |
          # a fresh, empty database (the test run above leaves its own tables behind)
          psql -h localhost -U postgres -c "CREATE DATABASE projectflow_migrations"
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/projectflow_migrations"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-smoke:
    name: Docker image boots and serves the app
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        env:
          POSTGRES_PASSWORD: ci_postgres_password
          SECRET_KEY: ci-only-secret-key-ci-only-secret-key-0123456789
          BOOTSTRAP_ADMIN_EMAIL: admin@example.com
          BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password-1
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Health, SPA, and login through the real stack
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8000/projects/1 | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/projects)" = "401"
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"ci-admin-password-1"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -fsS http://localhost:8000/api/projects -H "Authorization: Bearer $TOKEN"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/docs)" = "404"   # docs are off in production
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
